<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Вэфире · пульт</title>
    <style>
      :root { color-scheme: dark; --bg:#0b0d12; --accent:#ff7a00; --muted:#9aa3b5; }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { margin:0; height:100%; background:var(--bg); color:#f4f6fb;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; overflow:hidden; touch-action:none; }
      .wrap { height:100%; display:grid; grid-template-rows:auto 1fr auto; }
      .bar { display:flex; gap:.4rem; padding:.55rem .6rem; align-items:center; background:#12151c;
        border-bottom:1px solid rgba(255,255,255,.08); }
      .bar button { border:0; border-radius:999px; padding:.55rem .8rem; background:rgba(255,255,255,.08);
        color:inherit; font:inherit; }
      .bar button.accent { background:var(--accent); color:#111; font-weight:700; }
      .status { margin-left:auto; color:var(--muted); font-size:.75rem; }
      .stage { position:relative; background:#000; overflow:hidden; display:grid; place-items:center; }
      #frame { max-width:100%; max-height:100%; width:auto; height:auto; object-fit:contain;
        touch-action:none; user-select:none; background:#111; }
      .dock { padding:.55rem .6rem calc(.55rem + env(safe-area-inset-bottom)); background:#12151c;
        border-top:1px solid rgba(255,255,255,.08); display:grid; gap:.45rem; }
      .row { display:flex; gap:.4rem; }
      .row input { flex:1; border-radius:12px; border:1px solid rgba(255,255,255,.14); background:#0f1218;
        color:inherit; padding:.7rem .8rem; font:inherit; }
      .hint { color:var(--muted); font-size:.78rem; margin:0; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="bar">
        <button type="button" id="btnBack">← Назад</button>
        <button type="button" id="btnHome">Домой</button>
        <button type="button" id="btnReload">↻</button>
        <span class="status" id="status">загрузка…</span>
      </div>
      <div class="stage"><img id="frame" alt="ТВ" draggable="false" /></div>
      <div class="dock">
        <p class="hint">Картинка = экран ТВ. Жесты: тап = клик, свайп = скролл. Текст уходит в поиск на сайте.</p>
        <div class="row">
          <input id="text" placeholder="Поиск / текст" autocomplete="off" enterkeyhint="send" />
          <button type="button" class="accent" id="btnType">Ввод</button>
        </div>
        <div class="row">
          <button type="button" id="btnSpace">Пробел</button>
          <button type="button" id="btnEnter">Enter</button>
          <button type="button" id="btnEsc">Esc</button>
          <button type="button" id="btnLeft">◀ 10с</button>
          <button type="button" id="btnRight">▶ 10с</button>
        </div>
      </div>
    </div>
    <script>
      const frame = document.getElementById("frame");
      const statusEl = document.getElementById("status");
      const textEl = document.getElementById("text");
      let meta = { width: 1280, height: 720 };
      let lastTap = 0, dragging = false, lastX = 0, lastY = 0;

      async function post(body) {
        try {
          const r = await fetch("/api/input", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });
          const data = await r.json().catch(() => ({}));
          if (data.width) meta.width = data.width;
          if (data.height) meta.height = data.height;
        } catch (e) {
          statusEl.textContent = "нет связи с агентом";
        }
      }

      async function refreshMeta() {
        try {
          const r = await fetch("/api/meta");
          const data = await r.json();
          meta.width = data.width || meta.width;
          meta.height = data.height || meta.height;
          statusEl.textContent = data.ready ? "онлайн · ТВ" : "ждём браузер…";
        } catch (_) {
          statusEl.textContent = "нет связи";
        }
      }

      function mapPoint(clientX, clientY) {
        const rect = frame.getBoundingClientRect();
        if (!rect.width || !rect.height) return null;
        const x = ((clientX - rect.left) / rect.width) * meta.width;
        const y = ((clientY - rect.top) / rect.height) * meta.height;
        if (x < 0 || y < 0 || x > meta.width || y > meta.height) return null;
        return { x, y };
      }

      frame.addEventListener("pointerdown", (e) => {
        const p = mapPoint(e.clientX, e.clientY);
        if (!p) return;
        frame.setPointerCapture(e.pointerId);
        dragging = true; lastX = p.x; lastY = p.y;
        post({ type: "pointer", phase: "down", x: p.x, y: p.y });
      });
      frame.addEventListener("pointermove", (e) => {
        if (!dragging) return;
        const p = mapPoint(e.clientX, e.clientY);
        if (!p) return;
        const dy = p.y - lastY, dx = p.x - lastX;
        if (Math.abs(dy) > 6 || Math.abs(dx) > 6) {
          post({ type: "scroll", dx, dy: -dy * 1.6, x: p.x, y: p.y });
          lastX = p.x; lastY = p.y;
        }
      });
      function endPointer(e) {
        if (!dragging) return;
        dragging = false;
        const p = mapPoint(e.clientX, e.clientY) || { x: lastX, y: lastY };
        const now = Date.now();
        const dbl = now - lastTap < 320;
        lastTap = now;
        post({ type: "pointer", phase: "up", x: p.x, y: p.y, click: true, double: dbl });
      }
      frame.addEventListener("pointerup", endPointer);
      frame.addEventListener("pointercancel", endPointer);

      document.getElementById("btnBack").onclick = () => post({ type: "nav", action: "back" });
      document.getElementById("btnHome").onclick = () => post({ type: "nav", action: "home" });
      document.getElementById("btnReload").onclick = () => post({ type: "nav", action: "reload" });
      document.getElementById("btnType").onclick = () => {
        post({ type: "text", text: textEl.value || "" });
        textEl.value = "";
      };
      textEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter") { e.preventDefault(); document.getElementById("btnType").click(); }
      });
      document.getElementById("btnSpace").onclick = () => post({ type: "key", key: " " });
      document.getElementById("btnEnter").onclick = () => post({ type: "key", key: "Enter" });
      document.getElementById("btnEsc").onclick = () => post({ type: "key", key: "Escape" });
      document.getElementById("btnLeft").onclick = () => post({ type: "key", key: "ArrowLeft" });
      document.getElementById("btnRight").onclick = () => post({ type: "key", key: "ArrowRight" });

      frame.src = "/stream.mjpg?ts=" + Date.now();
      frame.onload = () => { statusEl.textContent = "онлайн · ТВ"; };
      frame.onerror = () => {
        statusEl.textContent = "переподключение картинки…";
        setTimeout(() => { frame.src = "/stream.mjpg?ts=" + Date.now(); }, 1000);
      };
      refreshMeta();
      setInterval(refreshMeta, 4000);
    </script>
  </body>
</html>
