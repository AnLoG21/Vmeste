server {
  listen 80;
  root /usr/share/nginx/html;
  absolute_redirect off;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_types text/css text/javascript application/javascript application/json application/xml image/svg+xml text/plain;

  # trailing slash → без слэша (кроме корня)
  location ~ ^(.+)/$ {
    return 301 $1;
  }

  # Дубли *.html → чистые URL (кроме служебных /yandex_*.html)
  location = /index.html {
    return 301 /;
  }
  location = /contacts.html {
    return 301 /contacts;
  }
  location = /offer.html {
    return 301 /offer;
  }
  location = /privacy.html {
    return 301 /privacy;
  }
  location = /businesses.html {
    return 301 /businesses;
  }
  location = /salon.html {
    return 301 /salon;
  }
  location = /avtoservis.html {
    return 301 /avtoservis;
  }
  location = /kafe.html {
    return 301 /kafe;
  }
  location = /blog.html {
    return 301 /blog;
  }
  location = /apps.html {
    return 301 /apps;
  }
  location = /android.html {
    return 301 /android;
  }
  location ~ ^/blog/(.+)\.html$ {
    return 301 /blog/$1;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Android App Links + iOS Universal Links (без редиректов, JSON)
  location ^~ /.well-known/ {
    default_type application/json;
    types { }
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }

  # Статика Яндекс.Вебмастера и иконки
  location = /yandex_84ec889f078f5b2d.html {
    try_files $uri =404;
  }
  location = /robots.txt {
    try_files $uri =404;
  }
  location = /legal.css {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }
  location = /favicon.png {
    try_files $uri =404;
  }
  location = /manifest.webmanifest {
    try_files $uri =404;
  }
  location = /apple-touch-icon.png {
    try_files $uri =404;
  }
  location = /og-cover.png {
    try_files $uri =404;
  }

  # Юридические и посадочные — отдаём реальные HTML (без soft-404)
  location = /contacts {
    try_files /contacts.html =404;
  }
  location = /offer {
    try_files /offer.html =404;
  }
  location = /privacy {
    try_files /privacy.html =404;
  }
  location = /businesses {
    try_files /businesses.html =404;
  }
  location = /salon {
    try_files /salon.html =404;
  }
  location = /avtoservis {
    try_files /avtoservis.html =404;
  }
  location = /kafe {
    try_files /kafe.html =404;
  }
  location = /blog {
    try_files /blog.html =404;
  }
  location ^~ /blog/ {
    try_files $uri $uri.html =404;
  }

  # Архив оферт
  location ^~ /legal/ {
    try_files $uri $uri/ =404;
  }

  # Города — только известные ключи (остальное = HTTP 404).
  # В проде Caddy отдаёт SSR с бэкенда; этот блок — fallback SPA.
  location ~ ^/city/(moscow|spb|ekaterinburg|kazan|novosibirsk|nizhny|rostov|krasnodar|samara|chelyabinsk)/?$ {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files /index.html =404;
  }

  # Публичная страница сервисов платформы (статика — без soft-404 для ботов)
  location = /apps {
    try_files /apps.html =404;
  }

  # Android: HTML с мета + binary APK
  location = /android {
    try_files /android.html =404;
  }
  location ^~ /downloads/ {
    default_type application/vnd.android.package-archive;
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }

  # Private link-only page (SPA) + its photo assets under /lubimaya/
  location = /lubimaya_arinochka {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header X-Robots-Tag "noindex, nofollow";
    try_files /index.html =404;
  }
  location ^~ /lubimaya/ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }

  # SPA-маршруты: публичные и кабинет (кабинет в robots Disallow)
  location ~ ^/(o|m|t|i|w|s)/ {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files /index.html =404;
  }
  location ~ ^/(cabinet|settings|subscriptions|organization|cafe|cafe-orders|inspections|marketplaces|staff|reviews|bookings|clients|intervals|chats|analytics|map|book|my-bookings|my-reviews|verify-email|confirm-password-change|reset-password|vmenu|vmagazine|vkvartire|services|activity|loyalty|cafe-orders-mine|shop|shop-orders|service-catalog)/?$ {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files /index.html =404;
  }

  location = / {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files /index.html =404;
  }

  # Всё неизвестное — настоящий HTTP 404 (для Яндекса)
  location / {
    try_files $uri =404;
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
    add_header Cache-Control "no-cache";
  }
}
