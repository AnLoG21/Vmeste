server {
  listen 80;
  root /usr/share/nginx/html;
  absolute_redirect off;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_types text/css text/javascript application/javascript application/json application/xml image/svg+xml text/plain;

  # trailing slash → без слэша (кроме корня)
  location ~ ^(.+)/$ {
    return 301 $1;
  }

  # Дубли *.html → чистые URL (кроме служебных)
  location = /index.html {
    return 301 /;
  }
  location = /contacts.html {
    return 301 /contacts;
  }
  location = /offer.html {
    return 301 /offer;
  }
  location = /privacy.html {
    return 301 /privacy;
  }
  location = /businesses.html {
    return 301 /businesses;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Статика Яндекс.Вебмастера и иконки
  location = /yandex_84ec889f078f5b2d.html {
    try_files $uri =404;
  }
  location = /robots.txt {
    try_files $uri =404;
  }
  location = /legal.css {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }
  location = /favicon.png {
    try_files $uri =404;
  }
  location = /manifest.webmanifest {
    try_files $uri =404;
  }
  location = /apple-touch-icon.png {
    try_files $uri =404;
  }
  location = /og-cover.png {
    try_files $uri =404;
  }

  # Юридические и посадочные — отдаём реальные HTML (без soft-404)
  location = /contacts {
    try_files /contacts.html =404;
  }
  location = /offer {
    try_files /offer.html =404;
  }
  location = /privacy {
    try_files /privacy.html =404;
  }
  location = /businesses {
    try_files /businesses.html =404;
  }

  # Архив оферт
  location ^~ /legal/ {
    try_files $uri $uri/ =404;
  }

  # Города — только известные ключи (остальное = HTTP 404)
  location ~ ^/city/(moscow|spb)/?$ {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files /index.html =404;
  }

  # SPA-маршруты: публичные и кабинет (кабинет в robots Disallow)
  location ~ ^/(o|m|t|i|w)/ {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files /index.html =404;
  }
  location ~ ^/(cabinet|settings|subscriptions|organization|cafe|cafe-orders|inspections|marketplaces|staff|reviews|bookings|intervals|chats|analytics|map|book|my-bookings|my-reviews|verify-email|confirm-password-change)/?$ {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files /index.html =404;
  }

  location = / {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files /index.html =404;
  }

  # Всё неизвестное — настоящий HTTP 404 (для Яндекса)
  location / {
    try_files $uri =404;
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
    add_header Cache-Control "no-cache";
  }
}
