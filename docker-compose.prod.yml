name: vmeste

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vmeste}
      POSTGRES_USER: ${POSTGRES_USER:-vmeste_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - vmeste_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vmeste_user} -d ${POSTGRES_DB:-vmeste}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    image: vmeste-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py sync_voice_asterisk || true &&
             python manage.py collectstatic --noinput &&
             python manage.py seed_demo --no-reset || true &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 1 --timeout 120"
    volumes:
      - vmeste_media:/app/media
      - ./firebase-credentials:/app/firebase-credentials:ro
      - ./asterisk/conf/generated:/app/asterisk/conf/generated
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "0"
      ASTERISK_CONF_DIR: /app/asterisk/conf/generated
      ASTERISK_AMI_HOST: asterisk
      ASTERISK_AMI_SECRET: ${ASTERISK_AMI_SECRET:-${ASTERISK_INTERNAL_SECRET}}
      FIREBASE_CREDENTIALS: ${FIREBASE_CREDENTIALS:-/app/firebase-credentials/service-account.json}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-vmeste-32513}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    image: vmeste-backend:latest
    restart: unless-stopped
    command: celery -A config worker -l info --concurrency=1
    volumes:
      - vmeste_media:/app/media
      - ./firebase-credentials:/app/firebase-credentials:ro
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "0"
      FIREBASE_CREDENTIALS: ${FIREBASE_CREDENTIALS:-/app/firebase-credentials/service-account.json}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-vmeste-32513}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started

  celery_beat:
    image: vmeste-backend:latest
    restart: unless-stopped
    command: celery -A config beat -l info
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "0"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    restart: unless-stopped
    depends_on:
      - web

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - vmeste_media:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - web

  # Опционально: туннель Cloudflare, если порты 80/443 снаружи закрыты.
  # При прямом DNS на Selectel cloudflared можно остановить.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    profiles:
      - tunnel
    depends_on:
      - caddy

  # SIP-телефония (Asterisk). Запуск: docker compose --profile telephony up -d
  # Требует ASTERISK_INTERNAL_SECRET в .env и sync: python manage.py sync_voice_asterisk
  asterisk:
    build:
      context: ./asterisk
      dockerfile: Dockerfile
    restart: unless-stopped
    profiles:
      - telephony
    ports:
      - "5060:5060/udp"
      - "10000-10050:10000-10050/udp"
    volumes:
      - ./asterisk/conf/generated:/etc/asterisk/generated:ro
    environment:
      VOICE_PUBLIC_BASE_URL: ${VOICE_PUBLIC_BASE_URL:-http://web:8000/api}
      ASTERISK_INTERNAL_SECRET: ${ASTERISK_INTERNAL_SECRET}
      ASTERISK_AMI_SECRET: ${ASTERISK_AMI_SECRET:-${ASTERISK_INTERNAL_SECRET}}
    depends_on:
      - web

volumes:
  vmeste_pgdata:
  vmeste_media:
  caddy_data:
  caddy_config:
