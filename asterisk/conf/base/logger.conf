; Keep Asterisk from filling the disk. Verbose console noise stays off files.
[general]
dateformat = %F %T.%3q
rotatesize = 50M
rotatestrategy = timestamp
exec_after_rotate = gzip -9 -f ${filename}.2

[logfiles]
; console: notice+ only (not verbose/debug)
console => notice,warning,error
; on-disk messages: rotated at 50M; entrypoint also truncates if oversized
messages => notice,warning,error
; disable legacy "full" verbose dump if the base image enabled it
full =>
security => notice,warning,error
