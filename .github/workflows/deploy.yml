name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      deploy_scripts: ${{ steps.filter.outputs.deploy_scripts }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'docker-compose.prod.yml'
              - 'agents-team/**'
            frontend:
              - 'frontend/**'
            deploy_scripts:
              - 'scripts/deploy-prod.sh'
              - 'scripts/write-agents-team-env.sh'
              - '.github/workflows/deploy.yml'

  # Full CI only when backend/infra changes — frontend-only pushes skip ~10–15 min of tests.
  ci:
    name: Gate — CI (backend)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/ci.yml

  frontend-gate:
    name: Gate — frontend build
    needs: changes
    if: needs.changes.outputs.frontend == 'true' && needs.changes.outputs.backend != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install + build
        run: |
          npm ci --no-audit --no-fund
          npm run build

  deploy:
    name: Deploy to VPS
    needs: [changes, ci, frontend-gate]
    if: |
      always() &&
      needs.changes.result == 'success' &&
      (needs.ci.result == 'success' || needs.ci.result == 'skipped') &&
      (needs.frontend-gate.result == 'success' || needs.frontend-gate.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TELEGRAM_TEAM_BOT_TOKEN: ${{ secrets.TELEGRAM_TEAM_BOT_TOKEN }}
      TELEGRAM_ALLOWED_USER_IDS: ${{ secrets.TELEGRAM_ALLOWED_USER_IDS }}
      TELEGRAM_HTTP_PROXY: ${{ secrets.TELEGRAM_HTTP_PROXY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      DEPLOY_BUILD_WEB: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.deploy_scripts == 'true' || github.event_name == 'workflow_dispatch' }}
      DEPLOY_BUILD_FRONTEND: ${{ needs.changes.outputs.frontend == 'true' || needs.changes.outputs.deploy_scripts == 'true' || needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Preflight secrets
        run: |
          if [ -z "${{ secrets.VPS_HOST }}" ] || [ -z "${{ secrets.VPS_USER }}" ] || [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "::error::Missing VPS_HOST / VPS_USER / VPS_SSH_KEY secrets"
            exit 1
          fi
          echo "build_web=${DEPLOY_BUILD_WEB} build_frontend=${DEPLOY_BUILD_FRONTEND}"
        env:
          DEPLOY_BUILD_WEB: ${{ env.DEPLOY_BUILD_WEB }}
          DEPLOY_BUILD_FRONTEND: ${{ env.DEPLOY_BUILD_FRONTEND }}

      - name: Deploy over SSH
        id: deploy
        uses: appleboy/ssh-action@v1.2.0
        continue-on-error: true
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          protocol: tcp
          timeout: 60s
          script_stop: true
          command_timeout: 40m
          envs: TELEGRAM_TEAM_BOT_TOKEN,TELEGRAM_ALLOWED_USER_IDS,TELEGRAM_HTTP_PROXY,GEMINI_API_KEY,CURSOR_API_KEY,DEPLOY_BUILD_WEB,DEPLOY_BUILD_FRONTEND
          script: |
            set -euo pipefail
            echo "[deploy] connected as $(whoami)@$(hostname)"
            cd /opt/vmeste
            git fetch --prune origin
            git checkout main
            git reset --hard origin/main
            chmod +x scripts/deploy-prod.sh scripts/write-agents-team-env.sh
            ./scripts/write-agents-team-env.sh
            export DEPLOY_BUILD_WEB="${DEPLOY_BUILD_WEB:-true}"
            export DEPLOY_BUILD_FRONTEND="${DEPLOY_BUILD_FRONTEND:-true}"
            ./scripts/deploy-prod.sh

      - name: Deploy over SSH (retry 1)
        id: deploy_retry1
        if: steps.deploy.outcome == 'failure'
        uses: appleboy/ssh-action@v1.2.0
        continue-on-error: true
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          protocol: tcp
          timeout: 60s
          script_stop: true
          command_timeout: 40m
          envs: TELEGRAM_TEAM_BOT_TOKEN,TELEGRAM_ALLOWED_USER_IDS,TELEGRAM_HTTP_PROXY,GEMINI_API_KEY,CURSOR_API_KEY,DEPLOY_BUILD_WEB,DEPLOY_BUILD_FRONTEND
          script: |
            set -euo pipefail
            echo "[deploy] retry 1 connected as $(whoami)@$(hostname)"
            cd /opt/vmeste
            git fetch --prune origin
            git checkout main
            git reset --hard origin/main
            chmod +x scripts/deploy-prod.sh scripts/write-agents-team-env.sh
            ./scripts/write-agents-team-env.sh
            export DEPLOY_BUILD_WEB="${DEPLOY_BUILD_WEB:-true}"
            export DEPLOY_BUILD_FRONTEND="${DEPLOY_BUILD_FRONTEND:-true}"
            ./scripts/deploy-prod.sh

      - name: Deploy over SSH (retry 2)
        if: steps.deploy.outcome == 'failure' && steps.deploy_retry1.outcome == 'failure'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          protocol: tcp
          timeout: 60s
          script_stop: true
          command_timeout: 40m
          envs: TELEGRAM_TEAM_BOT_TOKEN,TELEGRAM_ALLOWED_USER_IDS,TELEGRAM_HTTP_PROXY,GEMINI_API_KEY,CURSOR_API_KEY,DEPLOY_BUILD_WEB,DEPLOY_BUILD_FRONTEND
          script: |
            set -euo pipefail
            echo "[deploy] retry 2 connected as $(whoami)@$(hostname)"
            cd /opt/vmeste
            git fetch --prune origin
            git checkout main
            git reset --hard origin/main
            chmod +x scripts/deploy-prod.sh scripts/write-agents-team-env.sh
            ./scripts/write-agents-team-env.sh
            export DEPLOY_BUILD_WEB=true
            export DEPLOY_BUILD_FRONTEND=true
            ./scripts/deploy-prod.sh

  notify-failure:
    name: Ops alert on failure
    needs: [changes, ci, frontend-gate, deploy]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: POST ops webhook
        env:
          WEBHOOK: ${{ secrets.OPS_ALERT_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "OPS_ALERT_WEBHOOK_URL not set — skip"
            exit 0
          fi
          curl -sS -X POST "$WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"source\":\"vmeste\",\"event\":\"deploy_or_ci_failed\",\"detail\":\"$RUN_URL\",\"extra\":{\"ref\":\"${{ github.ref }}\",\"sha\":\"${{ github.sha }}\"}}" \
            || true
