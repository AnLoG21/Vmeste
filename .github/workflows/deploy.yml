name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  ci:
    name: Gate — CI
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to VPS
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Preflight secrets
        run: |
          if [ -z "${{ secrets.VPS_HOST }}" ] || [ -z "${{ secrets.VPS_USER }}" ] || [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "::error::Missing VPS_HOST / VPS_USER / VPS_SSH_KEY secrets"
            exit 1
          fi
          echo "Deploy target host configured (length=${#HOST})"
          echo "If this job fails in ~5s, open TCP 22 on the VPS security group and set VPS_HOST to the direct IP (not Cloudflare)."
        env:
          HOST: ${{ secrets.VPS_HOST }}

      - name: Deploy over SSH
        id: deploy
        uses: appleboy/ssh-action@v1.2.0
        continue-on-error: true
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          protocol: tcp
          timeout: 60s
          script_stop: true
          command_timeout: 40m
          script: |
            set -euo pipefail
            echo "[deploy] connected as $(whoami)@$(hostname)"
            cd /opt/vmeste
            git fetch --prune origin
            git checkout main
            git reset --hard origin/main
            chmod +x scripts/deploy-prod.sh
            ./scripts/deploy-prod.sh

      - name: Deploy over SSH (retry 1)
        id: deploy_retry1
        if: steps.deploy.outcome == 'failure'
        uses: appleboy/ssh-action@v1.2.0
        continue-on-error: true
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          protocol: tcp
          timeout: 60s
          script_stop: true
          command_timeout: 40m
          script: |
            set -euo pipefail
            echo "[deploy] retry 1 connected as $(whoami)@$(hostname)"
            cd /opt/vmeste
            git fetch --prune origin
            git checkout main
            git reset --hard origin/main
            chmod +x scripts/deploy-prod.sh
            ./scripts/deploy-prod.sh

      - name: Deploy over SSH (retry 2)
        if: steps.deploy.outcome == 'failure' && steps.deploy_retry1.outcome == 'failure'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          protocol: tcp
          timeout: 60s
          script_stop: true
          command_timeout: 40m
          script: |
            set -euo pipefail
            echo "[deploy] retry 2 connected as $(whoami)@$(hostname)"
            cd /opt/vmeste
            git fetch --prune origin
            git checkout main
            git reset --hard origin/main
            chmod +x scripts/deploy-prod.sh
            ./scripts/deploy-prod.sh

  notify-failure:
    name: Ops alert on failure
    needs: [ci, deploy]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: POST ops webhook
        env:
          WEBHOOK: ${{ secrets.OPS_ALERT_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "OPS_ALERT_WEBHOOK_URL not set — skip"
            exit 0
          fi
          curl -sS -X POST "$WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"source\":\"vmeste\",\"event\":\"deploy_or_ci_failed\",\"detail\":\"$RUN_URL\",\"extra\":{\"ref\":\"${{ github.ref }}\",\"sha\":\"${{ github.sha }}\"}}" \
            || true
