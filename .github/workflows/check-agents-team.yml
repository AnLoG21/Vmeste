name: Check agents-team

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 3m
          script: |
            set -uo pipefail
            echo "== xray inbounds =="
            sudo python3 - <<'PY' || python3 - <<'PY'
            import json
            for p in ["/usr/local/etc/xray/config.json","/etc/xray/config.json"]:
              try:
                cfg=json.load(open(p))
                print("file", p)
                for i,ib in enumerate(cfg.get("inbounds",[])):
                  print(i, ib.get("tag"), ib.get("protocol"), ib.get("port"), ib.get("listen"), list((ib.get("settings") or {}).keys()))
                break
              except Exception as e:
                print("skip", p, e)
            PY
            echo "== direct telegram (no proxy) =="
            curl -sS -m 8 https://api.telegram.org/ | head -c 80; echo || true
            echo "== via 127.0.0.1:10809 http =="
            curl -sS -m 15 -x http://127.0.0.1:10809 https://api.telegram.org/ | head -c 120; echo || true
            echo "== via 172.18.0.1:10809 http =="
            curl -sS -m 15 -x http://172.18.0.1:10809 https://api.telegram.org/ | head -c 120; echo || true
            echo "== TELEGRAM_API_BASE =="
            grep -E '^TELEGRAM_API_BASE=' /opt/vmeste/.env 2>/dev/null | sed 's/=.*/=***/' || echo none
            cd /opt/vmeste
            docker compose -f docker-compose.prod.yml --profile agents ps agents_team || true
            docker compose -f docker-compose.prod.yml --profile agents logs --tail=15 agents_team || true
