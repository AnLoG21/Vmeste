name: Check agents-team
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -euo pipefail
            cd /opt/vmeste
            docker compose -f docker-compose.prod.yml --profile agents ps agents_team
            docker compose -f docker-compose.prod.yml --profile agents logs --tail=50 agents_team
