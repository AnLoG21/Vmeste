name: Check agents-team

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 4m
          script: |
            set -uo pipefail
            echo "== xray inbounds =="
            python3 - <<'PY' || true
            import json
            p="/usr/local/etc/xray/config.json"
            try:
              cfg=json.load(open(p))
              for i,ib in enumerate(cfg.get("inbounds",[])):
                print(i, ib.get("tag"), ib.get("protocol"), ib.get("port"), ib.get("listen"))
            except Exception as e:
              print("xray cfg err", e)
            PY
            echo "== django web container telegram getMe =="
            cd /opt/vmeste
            TOKEN=$(grep -E '^TELEGRAM_BOT_TOKEN=' .env | cut -d= -f2- | tr -d '\r')
            docker compose -f docker-compose.prod.yml exec -T web python - <<PY
            import os, requests
            proxy=os.environ.get("TELEGRAM_HTTP_PROXY") or ""
            print("proxy", proxy)
            proxies={"http": proxy, "https": proxy} if proxy else None
            try:
              r=requests.get(f"https://api.telegram.org/bot{os.environ.get('TELEGRAM_BOT_TOKEN','')}/getMe", proxies=proxies, timeout=20)
              print("status", r.status_code, r.text[:200])
            except Exception as e:
              print("ERR", type(e), e)
            PY
            echo "== agents container node fetch =="
            docker compose -f docker-compose.prod.yml --profile agents exec -T agents_team node --input-type=module - <<'JS' || true
            import nodeFetch from 'node-fetch';
            import { HttpsProxyAgent } from 'https-proxy-agent';
            const proxy = process.env.TELEGRAM_HTTP_PROXY;
            const token = process.env.TELEGRAM_TEAM_BOT_TOKEN;
            console.log('proxy', proxy);
            const agent = new HttpsProxyAgent(proxy);
            try {
              const r = await nodeFetch('https://api.telegram.org/bot' + token + '/getMe', { agent, timeout: 25000 });
              console.log('status', r.status);
              console.log((await r.text()).slice(0, 300));
            } catch (e) {
              console.log('ERR', e.message);
            }
            JS
            docker compose -f docker-compose.prod.yml --profile agents logs --tail=20 agents_team || true
