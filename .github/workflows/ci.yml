name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vmeste_test
          POSTGRES_USER: vmeste
          POSTGRES_PASSWORD: vmeste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vmeste -d vmeste_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: ci-test-secret
      DEBUG: "0"
      POSTGRES_DB: vmeste_test
      POSTGRES_USER: vmeste
      POSTGRES_PASSWORD: vmeste
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      FRONTEND_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Migrate
        run: python manage.py migrate --noinput
      - name: Voice + booking + payments tests
        run: >
          python manage.py test
          voice.tests
          booking.tests_loyalty
          booking.tests_actions
          payments.tests
          --verbosity=2
