name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vmeste_test
          POSTGRES_USER: vmeste
          POSTGRES_PASSWORD: vmeste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vmeste -d vmeste_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: ci-test-secret
      DEBUG: "0"
      POSTGRES_DB: vmeste_test
      POSTGRES_USER: vmeste
      POSTGRES_PASSWORD: vmeste
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      FRONTEND_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Migrate
        run: python manage.py migrate --noinput
      - name: Voice + booking + payments tests
        run: >
          python manage.py test
          config.tests.test_health
          voice.tests
          booking.tests_loyalty
          booking.tests_loyalty_pay
          booking.tests_actions
          booking.tests_waitlist
          booking.tests_salon_p2
          inspections.tests_pdf
          inspections.tests_repair_funnel
          payments.tests
          marketplaces.tests
          marketplaces.tests_analytics
          marketplaces.tests_card_designs
          marketplaces.tests_sync
          cafe.test_delivery_zones
          cafe.test_courier_access
          cafe.test_menu_nutrition
          users.test_working_hours
          users.test_oauth_find_user
          users.test_oauth_credentials
          users.test_onboarding_p3
          vmenu.tests_units
          subscriptions.tests_promos
          notifications.tests_channels
          --verbosity=2

  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Build
        run: npm run build

  mobile-cap-sync:
    name: Capacitor Android sync
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install deps
        run: npm ci
      - name: Mobile env
        run: |
          printf 'VITE_API_URL=https://vsevmeste.space/api\n' > .env.mobile
      - name: Build mobile web bundle
        run: npm run build:mobile
      - name: Sync web assets into Android (no SDK)
        run: node scripts/sync-android-assets.mjs
      - name: Assert synced web assets
        run: |
          test -f android/app/src/main/assets/public/index.html
          test -f android/app/src/main/assets/capacitor.config.json
          grep -E 'assets/|App-' android/app/src/main/assets/public/index.html
      - name: Upload synced assets artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-cap-assets
          path: frontend/android/app/src/main/assets
          if-no-files-found: error
          retention-days: 7
