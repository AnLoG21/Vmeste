name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vmeste_test
          POSTGRES_USER: vmeste
          POSTGRES_PASSWORD: vmeste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vmeste -d vmeste_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: ci-test-secret
      DEBUG: "0"
      POSTGRES_DB: vmeste_test
      POSTGRES_USER: vmeste
      POSTGRES_PASSWORD: vmeste
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      FRONTEND_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Migrate
        run: python manage.py migrate --noinput
      - name: Voice + booking + payments tests (with coverage)
        run: >
          coverage run manage.py test
          config.tests.test_health
          voice.tests
          booking.tests_loyalty
          booking.tests_loyalty_pay
          booking.tests_loyalty_me_api
          booking.tests_loyalty_settings_api
          booking.tests_messaging_api
          booking.tests_calendar_api
          booking.tests_acquiring_api
          booking.tests_staff_invite_api
          booking.tests_staff_invite_create_api
          booking.tests_actions
          booking.tests_waitlist
          booking.tests_salon_p2
          booking.tests_client_book_api
          booking.tests_cancel_client_api
          booking.tests_org_booking_actions_api
          inspections.tests_pdf
          inspections.tests_repair_funnel
          inspections.tests_public_approve_api
          reviews.tests_client_reviews_api
          chat.tests_conversations_api
          chat.tests_chat_activity_api
          chat.tests_mark_read_api
          notifications.tests_in_app_api
          notifications.tests_telegram_link_api
          users.tests_notify_prefs_api
          users.tests_booking_messages_api
          users.tests_change_password_api
          users.tests_confirm_password_change_api
          users.tests_change_email_api
          users.tests_me_avatar_api
          users.tests_me_profile_api
          users.tests_delete_account_api
          users.tests_password_reset_api
          users.tests_email_verification_api
          locations.tests_branch_api
          users.tests_organization_info_api
          users.tests_gallery_api
          payments.tests
          marketplaces.tests
          marketplaces.tests_analytics
          marketplaces.tests_card_designs
          marketplaces.tests_sync
          marketplaces.tests_e2e_sandbox
          cafe.test_delivery_zones
          cafe.test_courier_access
          cafe.test_menu_nutrition
          cafe.tests_guest_order_pay
          shop.tests_public_order_pay
          users.test_working_hours
          users.test_oauth_find_user
          users.test_oauth_credentials
          users.test_onboarding_p3
          users.test_email_demo
          vmenu.tests_units
          subscriptions.tests_promos
          subscriptions.tests_trial_voice
          subscriptions.tests_yookassa_webhook
          subscriptions.tests_subscribe_pay
          subscriptions.tests_cancel_promo_api
          notifications.tests_channels
          moy_nalog.tests
          moy_nalog.tests_api
          --verbosity=2
      - name: Coverage report
        run: |
          coverage report
          coverage xml -o coverage.xml
      - name: Upload coverage XML
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Unit tests with coverage
        run: npm run test:coverage
      - name: Build
        run: npm run build
      - name: Assert App Links / Universal Links files
        run: |
          test -f dist/.well-known/assetlinks.json
          test -f dist/.well-known/apple-app-site-association
          grep -q 'space.vsevmeste.app' dist/.well-known/assetlinks.json
          grep -q 'space.vsevmeste.app' dist/.well-known/apple-app-site-association

  frontend-e2e:
    name: Frontend Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: frontend-build
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run E2E
        run: npm run test:e2e
        env:
          CI: "1"
  mobile-cap-sync:
    name: Capacitor Android sync
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Mobile env
        run: |
          printf 'VITE_API_URL=https://vsevmeste.space/api\n' > .env.mobile
      - name: Build mobile web bundle
        run: npm run build:mobile
      - name: Sync web assets into Android (no SDK)
        run: node scripts/sync-android-assets.mjs
      - name: Assert synced web assets
        run: |
          test -f android/app/src/main/assets/public/index.html
          test -f android/app/src/main/assets/capacitor.config.json
          grep -E 'assets/|App-' android/app/src/main/assets/public/index.html
      - name: Upload synced assets artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-cap-assets
          path: frontend/android/app/src/main/assets
          if-no-files-found: error
          retention-days: 7
