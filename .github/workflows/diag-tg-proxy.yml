name: Diagnose Telegram proxy
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 3m
          script: |
            set -euo pipefail
            echo "== host curl via socks =="
            curl -sS -m 20 -x socks5h://127.0.0.1:1080 https://api.telegram.org | head -c 200; echo
            echo "== container status =="
            cd /opt/vmeste
            docker compose -f docker-compose.prod.yml --profile agents ps agents_team
            echo "== logs =="
            docker compose -f docker-compose.prod.yml --profile agents logs --tail=100 agents_team || true
            echo "== in-container getMe test =="
            docker compose -f docker-compose.prod.yml --profile agents exec -T agents_team \
              node --input-type=module -e "
import nodeFetch from 'node-fetch';
import { SocksProxyAgent } from 'socks-proxy-agent';
import dotenv from 'dotenv';
dotenv.config({ path: '/app/.env' });
const token = process.env.TELEGRAM_TEAM_BOT_TOKEN;
const agent = new SocksProxyAgent(process.env.TELEGRAM_HTTP_PROXY || 'socks5h://127.0.0.1:1080');
const url = 'https://api.telegram.org/bot' + token + '/getMe';
const r = await nodeFetch(url, { agent, timeout: 20000 });
console.log('status', r.status);
console.log(await r.text());
" || true
